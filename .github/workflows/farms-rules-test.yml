name: Farms security test

# Proves the multi-farm database rules keep each farm private, using Google's Firestore emulator.
# Runs whenever the rules or the test change, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [farms/firestore.rules, tests/farms-rules.test.mjs, .github/workflows/farms-rules-test.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test tools
        run: npm install --no-save --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Run rules tests in the emulator
        run: npx firebase emulators:exec --only firestore --project demo-aqualedger-farms "node tests/farms-rules.test.mjs"
