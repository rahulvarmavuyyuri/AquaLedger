name: Setup check

# Checks the live site and the Firebase project settings the app needs.
# Run it any time from the Actions tab: Setup check → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check site and Firebase
        run: |
          KEY=$(grep -oP 'apiKey:\s*"\K[^"]+' firebase-config.js)
          PROJECT=$(grep -oP 'projectId:\s*"\K[^"]+' firebase-config.js)
          OWNER=$(grep -oP 'ownerEmails:\s*\["\K[^"]+' firebase-config.js)
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          HOST="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          ok(){ echo "PASS  $1"; echo "| ✅ | $1 |" >> "$GITHUB_STEP_SUMMARY"; }
          bad(){ echo "TODO  $1"; echo "| ❌ | $1 |" >> "$GITHUB_STEP_SUMMARY"; FAIL=1; }
          info(){ echo "INFO  $1"; echo "| ℹ️ | $1 |" >> "$GITHUB_STEP_SUMMARY"; }
          echo "| | Check |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # 1. Config filled in
          if [[ "$KEY" == YOUR_* || -z "$KEY" ]]; then bad "firebase-config.js still has placeholder keys"; else ok "firebase-config.js has keys for project $PROJECT"; fi
          if [[ "$OWNER" == "owner@example.com" ]]; then bad "Owner email is still owner@example.com"; else ok "Owner email set ($OWNER)"; fi
          grep -q "'$OWNER'" firestore.rules && ok "firestore.rules owner matches firebase-config.js" || bad "firestore.rules owner email doesn't match firebase-config.js"

          # 2. Site live with current config
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE")
          [[ "$CODE" == 200 ]] && ok "Site is live at $SITE" || bad "Site returned HTTP $CODE at $SITE"
          curl -s "${SITE}firebase-config.js" | grep -q "$PROJECT" && ok "Live site uses project $PROJECT" || bad "Live site doesn't have the new Firebase config yet"

          # 3. Authorized domains
          CFG=$(curl -s "https://identitytoolkit.googleapis.com/v1/projects?key=$KEY")
          echo "auth config: $(echo "$CFG" | head -c 400)"
          if echo "$CFG" | grep -q '"authorizedDomains"'; then
            echo "$CFG" | grep -q "\"$HOST\"" && ok "$HOST is an authorized sign-in domain" || bad "Add $HOST in Firebase → Authentication → Settings → Authorized domains"
          elif echo "$CFG" | grep -q CONFIGURATION_NOT_FOUND; then
            bad "Authentication isn't set up: Firebase → Build → Authentication → Get started"
          else
            bad "Couldn't read sign-in settings: $(echo "$CFG" | grep -oP '"message":\s*"\K[^"]+' | head -1)"
          fi

          # 4. Google sign-in enabled
          GA=$(curl -s -H 'Content-Type: application/json' -d "{\"providerId\":\"google.com\",\"continueUri\":\"$SITE\"}" "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$KEY")
          echo "google provider: $(echo "$GA" | head -c 300)"
          if echo "$GA" | grep -q '"authUri"'; then ok "Google sign-in is enabled"
          else bad "Enable Google in Firebase → Authentication → Sign-in method ($(echo "$GA" | grep -oP '"message":\s*"\K[^"]+' | head -1))"; fi

          # 5. Firestore exists and is locked to signed-in users
          FS=$(curl -s -w "\n%{http_code}" "https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents/tanks?key=$KEY&pageSize=1")
          FCODE=$(echo "$FS" | tail -1); FBODY=$(echo "$FS" | head -n -1)
          echo "firestore: $FCODE $(echo "$FBODY" | head -c 300)"
          case "$FCODE" in
            403) ok "Firestore database exists and blocks anonymous reads" ;;
            200) bad "Firestore is OPEN to anyone (test mode). Publish firestore.rules now" ;;
            404) bad "Firestore database not created: Firebase → Build → Firestore Database → Create database" ;;
            *)   bad "Firestore check returned HTTP $FCODE: $(echo "$FBODY" | grep -oP '"message":\s*"\K[^"]+' | head -1)" ;;
          esac
          info "Whether AquaLedger's own rules (not just Firebase's default lock) are published can only be confirmed by signing in as $OWNER: if you reach the dashboard, they are"

          exit ${FAIL:-0}
