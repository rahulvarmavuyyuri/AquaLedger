  </div>`);
}
function smProg(t) { const el = $("#sm_prog"); if (el) { el.hidden = false; el.innerHTML = `<span>${t}</span>`; } }
async function loadSampleFarms() {
  const doFarms = $("#sm_farms") && $("#sm_farms").checked && !$("#sm_farms").disabled, pick = $$(".sm_f").filter(x => x.checked).map(x => x.value), doReal = pick.length > 0;
  if (!doFarms && !doReal) { toast("Tick at least one option.", true); return; }
  const btn = $('[data-act="sample-load"]'); if (btn) btn.disabled = true;
  const t = today(), D = n => addDays(t, n), now = new Date().toISOString();
  let farms = 0, filled = 0, statsBlocked = false;
  try {
    if (doFarms) for (const sf of SAMPLE_FARMS) {
      smProg(`Adding ${esc(sf.name)}…`);
      const fid = "sample_" + sf.key, b = FDB.batch(), price = PLAN_INFO[sf.plan] ? PLAN_INFO[sf.plan].price : 0;
      const doc = { name: sf.name, location: sf.location, owner: sf.owner, phone: sf.phone, plan: sf.plan, status: sf.paused ? "paused" : "active", sample: true,
        createdAt: D(-sf.age) + "T09:00:00.000Z", createdBy: S.uid, payments: sf.pays.map(n => ({ date: D(-n), amount: price, method: n % 2 ? "UPI" : "Bank transfer", months: PLAN_INFO[sf.plan].months })) };
      if (sf.plan === "Trial") doc.trialEnds = D(sf.trial); else doc.paidUntil = D(sf.paid);
      b.set(FDB.doc(`farms/${fid}`), doc);
      b.set(FDB.doc(`farms/${fid}/members/${sf.owner}`), { role: "owner", addedBy: S.uid, at: now, sample: true });
      b.set(FDB.doc(`memberships/${sf.owner}/farms/${fid}`), { role: "owner", farmName: sf.name, sample: true });
      b.set(FDB.doc(`farms/${fid}/config/settings`), { farmName: sf.name, currency: "₹", staff: ["Ramesh", "Suresh", "Lakshmi"] });
      await withRetry(() => b.commit());
      await seedRecords(fid, sf);
      const days = {}; sf.act.forEach((v, i) => { if (v) days[D(i - 13)] = v; });
      const last = sf.act.map((v, i) => v ? i : -1).filter(i => i >= 0).pop();
      try { await FDB.doc(`farms/${fid}/stats/activity`).set({ days, lastEntry: last == null ? D(-22) : D(last - 13), ponds: 4, live: sf.fish ? 96000 : 612000, team: sf.team, at: now }); } catch (e) { statsBlocked = true; }
      farms++;
    }
    if (doReal) for (const f of S.allFarms.filter(x => pick.includes(x.id))) {
      smProg(`Adding sample records to ${esc(f.name || "farm")}…`);
      await seedRecords(f.id); filled++;
      try { await FDB.doc(`farms/${f.id}/stats/activity`).set({ ponds: 5, team: 1, lastEntry: t, at: now }, { merge: true }); } catch (e) { statsBlocked = true; }
    }
    closeSheet();
    toast(`Sample data loaded: ${farms} sample farm${farms === 1 ? "" : "s"}${doReal ? `, ${filled} real farm${filled === 1 ? "" : "s"} filled` : ""}.${statsBlocked ? " Activity bars need the new farms rules published." : ""}`);
  } catch (e) { toast(dbErr(e), true); if (btn) btn.disabled = false; }
}
async function clearSampleFarms() {
  const btn = $('[data-act="sample-clear"]'); if (btn) btn.disabled = true;
  try {
    for (const f of S.allFarms) {
      smProg(`Cleaning ${esc(f.name || "farm")}…`);
      const refs = [];
      for (const col of COLS) {
        const q = f.sample ? FDB.collection(`farms/${f.id}/${col}`) : FDB.collection(`farms/${f.id}/${col}`).where("sample", "==", true);
        (await q.get()).docs.forEach(d => refs.push(d.ref));
      }
      if (f.sample) {
        (await FDB.collection(`farms/${f.id}/members`).get()).docs.forEach(d => { refs.push(d.ref); refs.push(FDB.doc(`memberships/${d.id}/farms/${f.id}`)); });
        refs.push(FDB.doc(`farms/${f.id}/config/settings`), FDB.doc(`farms/${f.id}/stats/activity`));
      }
      for (let i = 0; i < refs.length; i += 400) { const b = FDB.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await withRetry(() => b.commit()); }
      if (f.sample) await FDB.doc(`farms/${f.id}`).delete();
    }
    closeSheet(); toast("Sample data removed");
  } catch (e) { toast(dbErr(e), true); if (btn) btn.disabled = false; }
}

async function loadSampleFb(sd, ORDER, total) {
  const tankIds = {}, itemIds = {}, ops = [];
  ORDER.forEach(col => sd[col].forEach(r => { const ref = S.db.collection(col).doc(); if (col === "tanks") tankIds[r._k] = ref.id; if (col === "items") itemIds[r._k] = ref.id; ops.push([ref, r]); }));
  S.seeding = { label: "Loading sample farm", done: 0, total }; render();
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = S.db.batch();
      ops.slice(i, i + 400).forEach(([ref, r]) => {
        const o = { ...r, sample: true, at: new Date().toISOString(), by: S.uid || null };
        if ("_tank" in o) o.tankId = o._tank ? tankIds[o._tank] : ""; if ("_item" in o) o.itemId = itemIds[o._item];
        delete o._k; delete o._tank; delete o._item; b.set(ref, o);
      });
      await b.commit(); S.seeding.done = Math.min(total, i + 400); render();
    }
    toast("Sample farm loaded");
  } catch (e) { toast(dbErr(e), true); }
  S.seeding = null; render();
}
async function clearSampleFb(docs) {
  S.seeding = { label: "Removing sample data", done: 0, total: docs.length }; render();
  try {
    for (let i = 0; i < docs.length; i += 400) {
      const b = S.db.batch(); docs.slice(i, i + 400).forEach(([c, id]) => b.delete(S.db.doc(c + "/" + id)));
      await b.commit(); S.seeding.done = Math.min(docs.length, i + 400); render();
    }
    toast("Sample data removed");
  } catch (e) { toast(dbErr(e), true); }
  S.seeding = null; render();
}

/* ---------------- boot ---------------- */
async function boot() {
  S.route = parseRoute();
  render();
  const C = window.claude;
  if (!(C && C.use)) {
    const cfg = window.AQUALEDGER_CONFIG;
    if (window.firebase && cfg && cfg.firebase && cfg.firebase.apiKey && !/^YOUR_/.test(cfg.firebase.apiKey)) return bootFirebase(cfg);
    S.demoReason = window.firebase
      ? "The multi-farm database isn't connected yet, so this is a sample farm and changes aren't saved. Add the new Firebase project's settings to farms/firebase-config.js."
      : "Couldn't load the database library. Check your internet connection and reload. Until then this is a sample farm and changes aren't saved.";
  }
  let db = null;
  if (C && C.use) { try { db = await C.use("db"); } catch (e) { db = null; } }
  if (!db) {
    S.mode = "local"; S.settings = {}; COLS.forEach(c => S[c] = []); await loadSample(); S.lastKey = ""; render(); return;
  }
  S.db = db;
  try {
    const [user, dl] = await Promise.all([C.use("user").catch(() => null), C.use("downloads").catch(() => null)]);
    S.user = user; S.downloads = dl;
    if (user) { S.uid = await user.id().catch(() => null); const cw = await user.can("data.write").catch(() => null); if (cw === false) S.canWrite = false; }
  } catch (e) {}
  const need = new Set(COLS.concat(["settings"]));
  const done = k => { if (need.delete(k) && !need.size) { S.mode = "db"; S.lastKey = ""; } render(); };
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => { S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() })); done(col); },
      err => { if (err && err.code === "revoked") { S.canWrite = false; } toast(dbErr(err), true); done(col); });
  });
  db.doc("config/settings").onSnapshot(s => { S.settings = s.exists ? { ...s.data() } : {}; done("settings"); }, () => done("settings"));
  setTimeout(() => { if (S.mode === "loading") { S.mode = "db"; S.lastKey = ""; render(); } }, 8000);
}
boot();
})();
