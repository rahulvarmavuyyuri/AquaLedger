<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Shrimp and fish farm management: tanks, stocking, feed, water quality, medication, mortality, harvest, inventory and profit.">
<meta name="theme-color" content="#03111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AquaLedger Farms">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>AquaLedger Farms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,780&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of farm sections on desktop, bottom tab bar + quick-log button on phones; content floats over a slow underwater light field. */
:root{
  --abyss:#03111b;
  --deep:#061c2b;
  --card:#0a2536;
  --card-2:#0d2d41;
  --line:#16405a;
  --line-soft:rgba(110,205,220,.10);
  --fg:#e3f2f4;
  --muted:#87a8b4;
  --faint:#5d7f8c;
  --accent:#5ce1d6;
  --accent-ink:#022a2a;
  --accent-soft:rgba(92,225,214,.13);
  --coral:#ff9473;
  --ok:#5fd69a;
  --warn:#f2c46d;
  --crit:#ff6f6f;
  --info:#7cb8ff;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--abyss);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);font-weight:650;letter-spacing:-.01em;text-wrap:balance;margin:0}
.num,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ocean backdrop */
#ocean{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.9}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 70% -10%,rgba(40,140,160,.18),transparent 60%),linear-gradient(180deg,transparent 40%,rgba(1,8,14,.6))}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(6,28,43,.82),rgba(3,17,27,.72));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#1d6f78,#0a2f3d);box-shadow:inset 0 0 0 1px rgba(92,225,214,.25),0 6px 20px rgba(0,0,0,.35)}
.brand .mark svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round}
.brand b{font-family:var(--font-display);font-size:19px;font-weight:780;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group h6{margin:0 0 4px;padding:0 12px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;position:relative;transition:color .2s,background .2s}
.nav a:hover{color:var(--fg);background:rgba(92,225,214,.06)}
.nav a.on{color:var(--fg);background:var(--accent-soft)}
.nav a.on svg{stroke:var(--accent)}
.nav a .badge{margin-left:auto}
.rail .spacer{flex:1}
.rail .log-btn{width:100%}

.main{min-width:0;padding-block:26px 120px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.topbar{display:none}
.tabbar{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:14px;transition:transform .15s var(--ease),background .2s,border-color .2s;white-space:nowrap}
a.btn{color:var(--fg);text-decoration:none}
.btn:hover{border-color:#24607e;background:var(--card-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 24px rgba(92,225,214,.25)}
.btn.pri:hover{background:#7ae9df}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.btn.danger{color:var(--crit);border-color:rgba(255,111,111,.35);background:rgba(255,111,111,.06)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn svg.i{width:18px;height:18px}
.icon-btn{width:40px;padding:0}

/* page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.phead h1{font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin-top:4px}
.phead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}

/* surfaces */
.panel{background:linear-gradient(180deg,rgba(13,45,65,.72),rgba(8,33,49,.72));border:1px solid var(--line-soft);border-radius:var(--r);padding:20px}
.panel h2{font-size:17px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel .ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 28px 30px;border:1px solid rgba(92,225,214,.16);background:radial-gradient(90% 140% at 0% 0%,#0f4a5a 0%,#082b3e 45%,#061c2b 100%)}
.hero .waves{position:absolute;left:0;right:0;bottom:-2px;height:90px;pointer-events:none;opacity:.55}
.hero .waves svg{position:absolute;bottom:0;width:200%;height:100%}
.hero .waves .w1{animation:drift 18s linear infinite;fill:rgba(92,225,214,.08)}
.hero .waves .w2{animation:drift 27s linear infinite reverse;fill:rgba(92,225,214,.05)}
@keyframes drift{to{transform:translateX(-50%)}}
.hero-top{position:relative;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero .greet{color:var(--muted);font-size:14px}
.hero h1{font-size:clamp(26px,3.6vw,40px);line-height:1.05;margin-top:4px;max-width:20ch}
.hero-stats{position:relative;display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:22px;margin-top:26px;align-items:end}
.stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--font-display);font-weight:650;font-size:26px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.big .v{font-size:clamp(40px,5.4vw,60px);font-weight:780;letter-spacing:-.03em;background:linear-gradient(180deg,#e9fbfa,#8fe9e1);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.big .v small{font-size:.42em;letter-spacing:0;-webkit-text-fill-color:var(--muted);margin-left:6px;font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:650;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line-soft);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(95,214,154,.09);border-color:rgba(95,214,154,.2)}
.chip.warn{color:var(--warn);background:rgba(242,196,109,.09);border-color:rgba(242,196,109,.22)}
.chip.crit{color:var(--crit);background:rgba(255,111,111,.1);border-color:rgba(255,111,111,.25)}
.chip.info{color:var(--info);background:rgba(124,184,255,.09);border-color:rgba(124,184,255,.22)}
.chip.acc{color:var(--accent);background:var(--accent-soft);border-color:rgba(92,225,214,.25)}
.chip.coral{color:var(--coral);background:rgba(255,148,115,.1);border-color:rgba(255,148,115,.25)}
.sp{flex:none;width:40px;height:40px;border-radius:13px;display:inline-grid;place-items:center;border:1px solid}
.sp svg.i{width:24px;height:24px;stroke-width:1.6}
.sp.shrimp{color:var(--coral);background:rgba(255,148,115,.1);border-color:rgba(255,148,115,.28)}
.sp.fish{color:var(--info);background:rgba(124,184,255,.1);border-color:rgba(124,184,255,.28)}
.sp.sm{width:30px;height:30px;border-radius:10px}
.sp.sm svg.i{width:19px;height:19px}
.tank:hover .sp svg.i{animation:swim 1.2s ease-in-out}
@keyframes swim{30%{transform:translateX(2px) rotate(-6deg)}60%{transform:translateX(-1px) rotate(4deg)}}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;display:inline-grid;place-items:center;background:var(--crit);color:#2a0606}
.badge.warn{background:var(--warn);color:#2b1e02}
.tcode{font-family:var(--font-data);font-size:12.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:7px;white-space:nowrap}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px 11px 0;border-radius:12px;background:rgba(3,17,27,.45);border:1px solid var(--line-soft);text-decoration:none;color:inherit;transition:background .2s,transform .2s var(--ease)}
.alert:hover{background:rgba(13,45,65,.8);transform:translateX(2px)}
.alert .bar{height:100%;min-height:34px;border-radius:0 4px 4px 0}
.alert.crit .bar{background:var(--crit)}
.alert.warn .bar{background:var(--warn)}
.alert.info .bar{background:var(--info)}
.alert b{font-weight:650;font-size:14px;display:block}
.alert span{color:var(--muted);font-size:12.5px}
.alert svg.i{color:var(--faint);width:16px;height:16px}
.allclear{display:flex;gap:12px;align-items:center;padding:16px;border-radius:12px;background:rgba(95,214,154,.06);border:1px solid rgba(95,214,154,.18);color:var(--ok);font-weight:600}

/* tank cards */
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tank{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r);background:linear-gradient(170deg,rgba(15,52,74,.85),rgba(8,30,45,.85));border:1px solid var(--line-soft);text-decoration:none;color:inherit;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.tank:hover{transform:translateY(-3px);border-color:rgba(92,225,214,.3);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.tank .water{position:absolute;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(92,225,214,.10),rgba(92,225,214,.02));border-top:1px solid rgba(92,225,214,.18);transition:height 1.2s var(--ease)}
.tank .water::before{content:"";position:absolute;left:0;top:-7px;width:200%;height:8px;background:radial-gradient(10px 5px at 10px 8px,rgba(92,225,214,.14) 98%,transparent) 0 0/20px 8px repeat-x;animation:drift 6s linear infinite}
.tank.inactive{opacity:.62}
.tank-h{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tank-h h3{font-size:18px;line-height:1.15}
.tank-h .loc{color:var(--muted);font-size:12.5px;margin-top:2px}
.tank-n{position:relative;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tank-n .v{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tank-n .u{color:var(--muted);font-size:13px}
.tank-m{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tank-m div{font-size:12px;color:var(--muted)}
.tank-m b{display:block;color:var(--fg);font-size:14px;font-family:var(--font-data);font-weight:500}
.params{position:relative;display:flex;gap:6px;flex-wrap:wrap}
.param{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:8px;background:rgba(3,17,27,.5);color:var(--muted)}
.param b{font-family:var(--font-data);font-weight:500;color:var(--fg)}
.param i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.param.ok i{background:var(--ok)} .param.warn i{background:var(--warn)} .param.crit i{background:var(--crit);box-shadow:0 0 0 3px rgba(255,111,111,.2)}
.param.crit b{color:var(--crit)} .param.warn b{color:var(--warn)}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.02em}
.in,select.in,textarea.in{height:42px;width:100%;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:rgba(3,17,27,.55);color:var(--fg);transition:border-color .2s,box-shadow .2s;min-width:0}
textarea.in{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(92,225,214,.15)}
.in::placeholder{color:var(--faint)}
.filters .fld{flex:1 1 150px;max-width:220px}
.filters .fld.q{flex:2 1 200px;max-width:320px}
.withunit{position:relative}
.withunit .in{padding-right:56px}
.withunit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--faint);font-family:var(--font-data);pointer-events:none}

/* table */
.summary{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.summary b{color:var(--fg);font-family:var(--font-data);font-weight:500}
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line-soft);background:rgba(4,20,31,.55)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;background:rgba(6,28,43,.6)}
.tbl td{padding:12px 14px;border-bottom:1px solid rgba(110,205,220,.06);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr[data-id]{cursor:pointer}
.tbl tbody tr[data-id]:hover{background:rgba(92,225,214,.05)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .sub{color:var(--muted);font-size:12.5px}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);background:rgba(6,28,43,.6)}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-crit{color:var(--crit);font-weight:600}
.more{display:flex;justify-content:center;padding-top:12px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px;color:var(--muted)}
.empty .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px;animation:breathe 4s ease-in-out infinite}
.empty .ring svg.i{width:28px;height:28px}
.empty h3{color:var(--fg);font-size:19px}
.empty p{margin:0;max-width:46ch}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(92,225,214,.05)}}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax text{fill:var(--faint);font-family:var(--font-data);font-size:10.5px}
.ax line{stroke:rgba(110,205,220,.08)}
.band{fill:rgba(95,214,154,.07)}
.band-l{fill:var(--ok);font-family:var(--font-body);font-size:10.5px;opacity:.75}
.ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.anim .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards}
.anim .ar{opacity:0;animation:fade .8s .5s forwards}
.anim .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .9s var(--ease) forwards}
.anim .hbar i{transform-origin:left;transform:scaleX(0);animation:growx 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes growx{to{transform:scaleX(1)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:3px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:rgba(3,17,27,.95);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;min-width:120px;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s;z-index:3;white-space:nowrap}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip div span:last-child{font-family:var(--font-data)}
.guide{stroke:rgba(227,242,244,.25);stroke-dasharray:3 3;opacity:0}
.guide.on{opacity:1}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.hbar .t{position:relative;height:10px;border-radius:6px;background:rgba(3,17,27,.6);overflow:hidden}
.hbar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.hbar .n{font-family:var(--font-data);font-size:12.5px;text-align:right;min-width:64px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid rgba(110,205,220,.06);align-items:center}
.tl-i:last-child{border-bottom:0}
.tl-i .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(3,17,27,.55);color:var(--accent)}
.tl-i .ic svg.i{width:17px;height:17px}
.tl-i b{font-weight:600;font-size:14px}
.tl-i span{color:var(--muted);font-size:12.5px;display:block}
.tl-i time{color:var(--faint);font-size:12px;font-family:var(--font-data);white-space:nowrap}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:16px;border-radius:14px;background:rgba(4,20,31,.55);border:1px solid var(--line-soft)}
.kpi .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.pos .v{color:var(--ok)} .kpi.neg .v{color:var(--crit)}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;border-radius:13px;background:rgba(3,17,27,.55);border:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:650;font-size:13.5px;transition:background .2s,color .2s}
.tabs button.on{background:var(--card-2);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(92,225,214,.2)}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(1,8,14,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(480px,100%);display:flex;flex-direction:column;background:linear-gradient(180deg,#0b2a3d,#071d2c);border-left:1px solid var(--line);box-shadow:-30px 0 80px rgba(0,0,0,.45);transform:translateX(104%);transition:transform .42s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.drawer,.sheet{visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s}
.drawer.on,.sheet.on{visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.dh h2{font-size:20px}
.dh .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.db{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.frow.one{grid-template-columns:minmax(0,1fr)}
.req{color:var(--coral)}
.err{color:var(--crit);font-size:12px;min-height:0}
.fld.bad .in{border-color:var(--crit)}
.preview{padding:14px;border-radius:12px;background:var(--accent-soft);border:1px solid rgba(92,225,214,.2);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.preview b{font-family:var(--font-data);font-weight:500}
.preview.warn{background:rgba(242,196,109,.08);border-color:rgba(242,196,109,.25);color:var(--warn)}
.df{display:flex;gap:10px;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);flex-wrap:wrap}
.df .grow{flex:1}
.meta{font-size:12px;color:var(--faint)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--crit)}

/* sheet (quick log / more) */
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);transition:transform .42s var(--ease);background:linear-gradient(180deg,#0c2d41,#071d2c);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -20px 60px rgba(0,0,0,.45)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:17px;margin:0 4px 12px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qgrid button,.qgrid a{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line-soft);background:rgba(3,17,27,.5);text-align:left;font-weight:650;font-size:14px;color:var(--fg);text-decoration:none;transition:transform .2s var(--ease),border-color .2s}
.qgrid button:hover,.qgrid a:hover{border-color:rgba(92,225,214,.3);transform:translateY(-2px)}
.qgrid .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qgrid small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:-6px}

/* menu */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:200px;padding:6px;border-radius:13px;background:#0b2a3d;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;transform-origin:top right;animation:pop .2s var(--ease)}
.menu button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;border:0;background:transparent;text-align:left;font-size:14px;font-weight:600}
.menu button:hover{background:rgba(92,225,214,.08)}
.menu small{color:var(--faint);margin-left:auto;font-family:var(--font-data);font-size:11px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}

/* toast */
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:13px;background:#0e3347;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45);font-weight:600;font-size:14px;animation:toastin .4s var(--ease)}
.toast.err{border-color:rgba(255,111,111,.4);color:#ffd2d2}
.toast svg.i{color:var(--accent)}
.toast.err svg.i{color:var(--crit)}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.97)}}

/* banner */
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:13px;background:rgba(124,184,255,.07);border:1px solid rgba(124,184,255,.2);color:#cfe3ff;font-size:13.5px;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}

/* progress */
.prog{height:6px;border-radius:6px;background:rgba(3,17,27,.6);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#9ff3ea);transition:width .3s}

/* skeleton */
.sk{border-radius:12px;background:linear-gradient(90deg,rgba(13,45,65,.5),rgba(23,70,95,.6),rgba(13,45,65,.5));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* entrance */
.enter > *{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.enter .tank{animation:rise .7s var(--ease) both;animation-delay:calc(200ms + var(--i,0) * 60ms)}

body.ro .w{display:none!important}

/* tank status labels */
.tchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tchips a{text-decoration:none;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tchips a:hover{transform:translateY(-1px)}
.tcount{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;margin-left:4px;border-radius:9px;font-size:11px;background:rgba(92,225,214,.12);color:var(--fg)}
/* multi-farm */
.diag{border-color:rgba(255,111,111,.45);background:linear-gradient(180deg,rgba(80,20,24,.55),rgba(40,12,16,.5))}
.diag h2{display:flex;align-items:center;gap:8px;color:#ffd2d2}
.diag-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.diag-steps .mono{overflow-wrap:anywhere;color:var(--accent)}
.farmsw{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.farmsw label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 8px}
.farmsw select{height:40px;font-weight:600}
.sheet .farmsw{margin:0 4px 14px;padding:0}
.pausedb{background:rgba(242,196,109,.08);border-color:rgba(242,196,109,.3);color:#ffe2a6}
/* account + sign-in gate */
.acct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:rgba(3,17,27,.45);border:1px solid var(--line-soft)}
.acct .av{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--font-display)}
.acct b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct small{display:block;font-size:11.5px;color:var(--muted)}
.acct .btn{margin-left:auto;height:34px;width:34px}
body.gate .rail,body.gate .topbar,body.gate .tabbar{display:none}
body.gate .app{grid-template-columns:minmax(0,1fr)}
.gatebox{position:relative;overflow:hidden;max-width:460px;width:100%;margin:9vh auto 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:40px 26px 70px;border-radius:24px;border:1px solid rgba(92,225,214,.16);background:radial-gradient(90% 120% at 50% 0%,#0f4a5a 0%,#082b3e 50%,#061c2b 100%)}
.gatebox h1{font-size:30px}
.gatebox p{margin:0;color:var(--muted);max-width:40ch}
.gatebox .err{min-height:1em}
.gatebox{padding-bottom:180px}
.gatebox > *:not(.scene){position:relative;z-index:1}
.gatebox .scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:170px;pointer-events:none}
.mark.big{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#1d6f78,#0a2f3d);box-shadow:inset 0 0 0 1px rgba(92,225,214,.3),0 14px 40px rgba(0,0,0,.4);animation:breathe 4s ease-in-out infinite}
.mark.big svg{width:42px;height:42px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round}

/* responsive */
@media (max-width:1100px){
  .hero-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero-stats .stat.big{grid-column:1/-1}
  .g-dash{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(3,17,27,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
  .topbar .brand b{font-size:17px}
  .main{padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;z-index:30;left:0;right:0;bottom:0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:rgba(4,20,31,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line-soft)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;position:relative}
  .tabbar .on{color:var(--accent)}
  .tabbar .fab{width:54px;height:54px;margin:-24px auto 0;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(92,225,214,.35),0 0 0 6px var(--abyss)}
  .tabbar .fab svg.i{width:24px;height:24px;stroke-width:2.2}
  .tabbar .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .hero{padding:22px 18px 24px;border-radius:18px}
  .hero-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .stat .v{font-size:21px}
  .tbl-wrap{border:0;background:transparent;overflow:visible}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tfoot{display:block;width:100%}
  .tbl tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:14px;border:1px solid var(--line-soft);border-radius:14px;margin-bottom:10px;background:rgba(8,33,49,.75)}
  .tbl td{display:block;padding:0;border:0;min-width:0;overflow-wrap:anywhere}
  .tbl td.r{text-align:left}
  .tbl td::before{content:attr(data-l);display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:2px}
  .tbl td.wide{grid-column:1/-1}
  .tbl tfoot tr{background:rgba(13,45,65,.8)}
  .filters .fld{max-width:none;flex:1 1 calc(50% - 10px)}
  .filters .fld.q{flex-basis:100%;max-width:none}
  .frow{grid-template-columns:minmax(0,1fr)}
  .frow.two-m{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawer{top:auto;width:100%;height:92%;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(104%);padding-top:0}
  .drawer.on{transform:none}
  .qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hbar{grid-template-columns:minmax(0,90px) minmax(0,1fr) auto}
  .phead .acts .btn.hide-m{display:none}
}

/* ===== Reef illustrations ===== */
.sea{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sea svg{display:block;height:auto;overflow:visible}
.sea .sw{position:absolute;left:0;opacity:.3;will-change:transform;animation:swimX var(--dur,60s) linear infinite;animation-delay:var(--del,0s)}
.sea .sw.rev{animation-name:swimXr}
.sea .flip{transform:scaleX(-1)}
.sea .sw1{top:14%;--dur:58s;--del:-8s}
.sea .sw2{top:58%;--dur:96s;--del:-40s;opacity:.26}
.sea .sw3{top:30%;--dur:82s;--del:-22s;opacity:.22}
.sea .sw4{top:80%;--dur:68s;--del:-50s}
.sea .sw5{top:44%;--dur:50s;--del:-15s;opacity:.26}
.sea .jf{position:absolute;bottom:-30vh;opacity:.32;will-change:transform;animation:jrise var(--dur,70s) linear infinite;animation-delay:var(--del,0s)}
.sea .jf1{right:7%;--dur:74s;--del:-20s}
.sea .jf2{left:38%;--dur:92s;--del:-62s;opacity:.22}
@keyframes swimX{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
@keyframes swimXr{from{transform:translateX(115vw)}to{transform:translateX(-30vw)}}
@keyframes jrise{from{transform:translateY(0)}to{transform:translateY(-150vh)}}
.bob{animation:bob 5s ease-in-out infinite}
.bob.slow{animation-duration:8s}
.bob.flap{animation:flap 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes flap{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-8px) scaleY(.82)}}
.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 30%}
@keyframes pulse{0%,100%{transform:scale(1,1)}40%{transform:scale(1.08,.88)}70%{transform:scale(.96,1.05)}}

.hero{padding:0}
.hero-scene{position:relative;min-height:230px;padding:28px 28px 30px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
.hero-scene .scene{position:absolute;inset:0;width:100%;height:100%}
.hero-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,28,43,.94) 0%,rgba(6,28,43,.7) 34%,rgba(6,28,43,0) 62%);pointer-events:none}
.hero-scene .hero-top{z-index:2}
.hero-scene .hero-top h1{text-shadow:0 2px 18px rgba(3,17,27,.6)}
.hero .hero-stats{margin-top:0;padding:22px 28px 26px;border-top:1px solid rgba(92,225,214,.14);background:linear-gradient(180deg,rgba(3,17,27,.55),rgba(3,17,27,.3))}
.scene .rays polygon{animation:rayglow 9s ease-in-out infinite}
@keyframes rayglow{0%,100%{opacity:.5}50%{opacity:1}}
.scene .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.scene .anem .sway{transform-origin:0 100%}
.scene .bob{transform-box:fill-box;animation:bob 6s ease-in-out infinite}
.scene .bob2{animation:bob2 7s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,-12px)}}
.scene .school{animation:school 26s linear infinite}
@keyframes school{from{transform:translate(1260px,70px)}to{transform:translate(-260px,40px)}}
.scene .glide{animation:glide 44s linear infinite;animation-delay:-12s}
@keyframes glide{from{transform:translate(-180px,10px)}50%{transform:translate(520px,-6px)}to{transform:translate(1260px,12px)}}
.scene .jelly-drift{animation:jdrift 12s ease-in-out infinite}
@keyframes jdrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.scene .crab{animation:crab 9s ease-in-out infinite}
@keyframes crab{0%,100%{transform:translateX(0)}45%{transform:translateX(70px)}55%{transform:translateX(70px)}}
.scene .bub{fill:none;stroke:rgba(190,250,245,.55);stroke-width:1.4;animation:bub 8s linear infinite}
@keyframes bub{from{transform:translateY(0);opacity:0}10%{opacity:1}to{transform:translateY(-320px);opacity:0}}

.tank .water{container-type:inline-size}
.swimmer{position:absolute;left:8px;bottom:8px;width:40px;opacity:.85;will-change:transform;animation:pace 16s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.swimmer.shrimp{width:50px}
.swimmer svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes pace{0%{transform:translateX(0) scaleX(1)}46%{transform:translateX(calc(100cqw - 66px)) scaleX(1)}50%{transform:translateX(calc(100cqw - 66px)) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.tank:hover .swimmer{animation-duration:7s}

.critter{position:relative;width:150px;height:108px;display:grid;place-items:center;margin-bottom:4px}
.critter::before{content:"";position:absolute;inset:8px 12px;border-radius:50%;background:radial-gradient(closest-side,rgba(92,225,214,.16),transparent)}
.critter svg{position:relative;width:auto;height:96px;max-width:150px;overflow:visible;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.4))}
.critter.c-fish svg,.critter.c-crab svg,.critter.c-shrimp svg{height:auto;width:130px}
.critter.c-turtle svg,.critter.c-manta svg{height:auto;width:148px}
.critter .cb{position:absolute;bottom:20px;left:62%;width:7px;height:7px;border-radius:50%;border:1.4px solid rgba(190,250,245,.6);animation:cbub 4s linear infinite}
.critter .cb:nth-child(3){left:70%;width:5px;height:5px;animation-delay:-1.3s}
.critter .cb:nth-child(4){left:56%;width:4px;height:4px;animation-delay:-2.6s}
@keyframes cbub{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-90px);opacity:0}}

.loader{display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600}
.loader .lf{width:64px;animation:lf 1.6s ease-in-out infinite}
.loader .lf svg{display:block;width:100%;height:auto}
@keyframes lf{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(12px,-6px) rotate(4deg)}}

@media (max-width:900px){.sea .sw3,.sea .sw5,.sea .jf2{display:none}}
@media (max-width:720px){
  .hero-scene{min-height:210px;padding:22px 18px 24px}
  .hero-scene::after{background:linear-gradient(180deg,rgba(6,28,43,.9) 0%,rgba(6,28,43,.55) 55%,rgba(6,28,43,.15) 100%)}
  .hero .hero-stats{padding:18px}
  .sea .sw{opacity:.22}
  .sea .sw1 svg{width:150px}.sea .sw2 svg{width:140px}
}
@media (prefers-reduced-motion:reduce){
  .sea{display:none}
  .scene *, .swimmer, .critter svg, .critter .cb, .pulse, .bob, .loader .lf{animation:none!important}
  .critter .cb{display:none}
  .scene .school{transform:translate(1020px,60px)}
  .scene .glide{transform:translate(560px,0)}
  .scene .bub{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .anim .ln{stroke-dashoffset:0}
}

.adm-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.fu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fu li{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:12px;background:rgba(3,17,27,.45);border:1px solid var(--line-soft);border-left:3px solid var(--warn)}
.fu li.crit{border-left-color:var(--crit)}.fu li.info{border-left-color:var(--info)}
.fu b{display:block;font-weight:650;font-size:14px}.fu span{font-size:12.5px;color:var(--muted)}
.fu .grow{min-width:0;flex:1}
svg.inc{width:100%;height:auto;display:block}
.inc text{fill:var(--muted);font:500 11px var(--font-body,inherit)}.inc .vl{fill:var(--fg);font-weight:650}
.inc .g{stroke:var(--line-soft)}.inc .b{fill:var(--accent);opacity:.55}.inc .b.now{opacity:1}
.recent{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--line-soft)}
.recent div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.recent .sub{font-size:12px;color:var(--muted)}
.srch{position:relative;display:block;width:min(280px,100%)}
.srch .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.srch .in{padding-left:36px;height:38px}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fcard{min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:rgba(3,17,27,.5);border:1px solid var(--line-soft);transition:border-color .2s}
.fcard:hover{border-color:var(--line)}
.fcard.off{opacity:.72}
.fcard header{display:flex;gap:10px;align-items:flex-start}
.fcard h3{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.fcard .sub{color:var(--muted);font-size:12.5px}
.fcard .grow{flex:1;min-width:0}
.fcard .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.fcard .who .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .who .i{width:15px;height:15px;flex:none}
.fcard .who a{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;white-space:nowrap;font-weight:600}
.use{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding:10px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.use div{min-width:0}.use dt{font-size:11.5px;color:var(--muted)}.use dd{margin:2px 0 0;font-weight:650;font-size:13.5px}
.use dd .sub{display:block;font-weight:500;font-size:11.5px}
.use dd.ok{color:var(--ok)}.use dd.warn{color:var(--warn)}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;max-width:10px;border-radius:2px 2px 0 0;background:var(--accent);opacity:.7}
.spark i.z{background:var(--line);opacity:1}
.spark .sub{margin-left:auto;align-self:center;white-space:nowrap;padding-left:8px}
.fcard footer{display:flex;gap:6px;flex-wrap:wrap}
.fcard footer .ghost{margin-left:auto}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:6px 0 14px}
.sh-h .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sh-h h2{margin:2px 0 0;font-size:22px}
.form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sh-f{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.hist{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
.hist h3{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:6px 0;font-size:13.5px}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list button{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(3,17,27,.45);font-weight:600;text-align:left;color:var(--fg)}
.menu-list button.danger{color:var(--crit)}
.menu-list .i{width:18px;height:18px}
.sheet{max-height:90vh;overflow:auto}
@media (max-width:900px){.adm-row{grid-template-columns:1fr}.srch{width:100%}.fcards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.use{grid-template-columns:repeat(2,minmax(0,1fr))}}

.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(3,17,27,.45);cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk b{display:block;font-weight:650}.chk .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.fcard header{flex-wrap:wrap}
.smlist{display:flex;flex-direction:column;gap:6px}.smhd{display:flex;justify-content:space-between;align-items:center}
.chk.sm{padding:10px 12px}
.tk-r{display:flex;align-items:flex-start;gap:8px;flex:none}
.tstat{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tstat i{width:8px;height:8px;border-radius:50%;background:currentColor}
.tstat.on{color:#5fd69a;background:rgba(95,214,154,.12);border:1px solid rgba(95,214,154,.35)}
.tstat.on i{box-shadow:0 0 0 3px rgba(95,214,154,.18)}
.tstat.off{color:#ff6f6f;background:rgba(255,111,111,.12);border:1px solid rgba(255,111,111,.4)}
.tank.inactive .tstat{opacity:1}
</style>
</head>

<script>
(() => {
"use strict";
/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const NF = new Intl.NumberFormat("en-IN");
const nf = (v, d = 0) => v == null || !isFinite(v) ? "—" : new Intl.NumberFormat("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const nfx = (v, max = 2) => v == null || v === "" || !isFinite(v) ? "—" : new Intl.NumberFormat("en-IN", { maximumFractionDigits: max }).format(v);
const sum = (arr, k) => arr.reduce((a, r) => a + (Number(typeof k === "function" ? k(r) : r[k]) || 0), 0);
const norm = s => String(s || "").trim().toLowerCase();
const pad = n => String(n).padStart(2, "0");
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const dnum = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const dstr = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => dstr(dnum(s) + n);
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fdate(s, yr) { if (!s) return "—"; const y = s.slice(0, 4); return `${+s.slice(8, 10)} ${MON[+s.slice(5, 7) - 1]}${(yr || y !== today().slice(0, 4)) ? " " + y : ""}`; }

const cur = () => S.settings.currency || "₹";
const money = (v, d = 0) => v == null || !isFinite(v) ? "—" : (v < 0 ? "−" : "") + cur() + nf(Math.abs(v), d);

/* ---------------- state ---------------- */
const COLS = ["tanks", "stocking", "medication", "feed", "water", "mortality", "harvest", "items", "purchases", "expenses"];
const S = {
  db: null, user: null, uid: null, mode: "loading", canWrite: true,
  loaded: {}, settings: {}, route: { name: "dashboard" }, lastKey: "",
  f: {}, lim: {}, rep: { tab: "seed", tank: "", from: addDays(today(), -29), to: today(), param: "do" },

COLS.forEach(c => S[c] = []);

const TH = {
  ph: { l: "pH", u: "", min: 7.5, max: 8.5, m: 0.3, dp: 2 },
  temp: { l: "Temperature", u: "°C", min: 26, max: 32, m: 2, dp: 1 },
  do: { l: "Dissolved O₂", u: "mg/L", min: 4, max: null, m: 1, dp: 1 },

const WP = Object.keys(TH);
const thr = p => ({ ...TH[p], ...((S.settings.thresholds || {})[p] || {}) });
function wStatus(p, v) {

  if (t.min != null && t.min !== "" && v < t.min) return v < t.min - t.m ? "crit" : "warn";

}
function rangeText(p) { const t = thr(p); if (t.min != null && t.max != null) return `${t.min}–${t.max}${t.u ? " " + t.u : ""}`; if (t.min != null) return `≥ ${t.min} ${t.u}`; return `≤ ${t.max} ${t.u}`; }

const SERIES = ["#5ce1d6", "#ff9473", "#f2c46d", "#a99bff", "#7ee08a", "#6db8ff", "#f58bc2", "#c9e265"];

/* ---------------- lookups ---------------- */
const tankById = id => S.tanks.find(t => t.id === id);
const tankSort = (a, b) => String(a.code || "").localeCompare(String(b.code || ""), undefined, { numeric: true });
const tanksSorted = () => [...S.tanks].sort(tankSort);
const tankColor = id => { const i = tanksSorted().findIndex(t => t.id === id); return SERIES[(i < 0 ? 0 : i) % SERIES.length]; };
const tankLabel = id => { const t = tankById(id); return t ? (t.code || t.name) : "—"; };
function tankCell(id) { const t = tankById(id); if (!id) return `<span class="sub">Farm-wide</span>`; if (!t) return `<span class="sub">Deleted tank</span>`; return `<span class="tcode">${esc(t.code || "—")}</span> <span class="sub">${esc(t.name || "")}</span>`; }
function spIcon(sp, size = "") { const f = sp === "Fish"; return sp ? `<span class="sp ${f ? "fish" : "shrimp"} ${size}" title="${f ? "Fish" : "Shrimp"}" role="img" aria-label="${f ? "Fish" : "Shrimp"}">${ic(f ? "fish" : "shrimp")}</span>` : ""; }
const byDateDesc =(a, b) => (b.date || "").localeCompare(a.date || "") || (b.time || "").localeCompare(a.time || "") || (b.at || "").localeCompare(a.at || "");
const byDateAsc = (a, b) => -byDateDesc(a, b);

/* ---------------- domain math ---------------- */
function conv(q, from, to) {
  q = Number(q) || 0; if (from === to || !from || !to) return q;
  const f = { g: ["kg", 1e-3], ml: ["l", 1e-3], kg: ["kg", 1], l: ["l", 1] };
  const a = f[from], b = f[to]; if (!a || !b || a[0] !== b[0]) return q;
  return q * a[1] / b[1];
}
function itemByName(name, cats) { const n = norm(name); return S.items.find(i => norm(i.name) === n && (!cats || cats.includes(i.category))); }
function itemStats(it) {
  const pur = S.purchases.filter(p => p.itemId === it.id);
  const inQty = sum(pur, "qty"), inCost = sum(pur, "cost");
  const avg = inQty ? inCost / inQty : 0;
  const n = norm(it.name);
  let used = 0;
  if (it.category === "Feed") used = sum(S.feed.filter(f => norm(f.feedType) === n), r => conv(r.qty, "kg", it.unit));
  else used = sum(S.medication.filter(m => norm(m.name) === n), r => conv(r.qty, r.unit, it.unit));
  const stock = inQty - used;
  const reorder = Number(it.reorder) || 0;
  const st = stock <= 0 && inQty > 0 ? "crit" : (reorder && stock <= reorder ? "warn" : "ok");
  return { inQty, used, stock, avg, value: Math.max(0, stock) * avg, st };
}
const feedCost = f => { const it = itemByName(f.feedType, ["Feed"]); return it ? (Number(f.qty) || 0) * itemStats(it).avg : 0; };
const medCost = m => { const it = itemByName(m.name, ["Medication", "Chemical"]); return it ? conv(m.qty, m.unit, it.unit) * itemStats(it).avg : 0; };
const hPcs = h => Number(h.count) || ((Number(h.qty) && Number(h.avgWeight)) ? Math.round(h.qty * 1000 / h.avgWeight) : 0);

function cycles(tid) {
  const finals = S.harvest.filter(h => h.tankId === tid && h.type === "Final").map(h => h.date).sort();
  const bounds = [""].concat(finals);
  const out = [];
  for (let i = 0; i < bounds.length; i++) {
    const lo = bounds[i], hi = bounds[i + 1];

}
function cycleStats(tid, inC, lo, hi) {

const store = {
  async add(col, data) {

  async set(col, id, data) {

    if (S.db) { const p = S.db.doc(col + "/" + id).set(rest); if (S.fb) { p.catch(e => toast(dbErr(e), true)); return; } return p; }
    Object.assign(old, data); render();

function lineChart(o) {

  const t0 = dnum(o.from), t1 = Math.max(dnum(o.to), t0 + 1);
  const vals = o.series.flatMap(s => s.pts.map(p => p.v)).filter(v => isFinite(v));
  if (!vals.length) return `<div class="empty" style="padding:28px">${ic("chart")}<p>No readings in this period.</p></div>`;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (o.band) { if (o.band.min != null) lo = Math.min(lo, o.band.min); if (o.band.max != null) hi = Math.max(hi, o.band.max); }
  if (o.zero) lo = Math.min(0, lo);
  const tk = niceTicks(lo, hi, 4); lo = tk[0]; hi = tk[tk.length - 1];
  const x = d => P.l + (dnum(d) - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / ((hi - lo) || 1)) * (H - P.t - P.b);
  const id = "c" + uid();
  CH[id] = { o, x, y, t0, t1, W, P, H };
  let g = `<g class="ax">${tk.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l - 8}" y="${y(v) + 3.5}" text-anchor="end">${nfx(v, 2)}</text>`).join("")}`;
  const nx = Math.min(N ? 3 : 5, t1 - t0);
  for (let i = 0; i <= nx; i++) { const d = dstr(Math.round(t0 + (t1 - t0) * i / nx)); g += `<text x="${x(d)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${fdate(d).replace(/ \d{4}$/, "")}</text>`; }
  g += `</g>`;
  let band = "";
  if (o.band) { const bt = y(o.band.max != null ? o.band.max : hi), bb = y(o.band.min != null ? o.band.min : lo); band = `<rect class="band" x="${P.l}" y="${bt}" width="${W - P.l - P.r}" height="${Math.max(0, bb - bt)}" rx="4"/><text class="band-l" x="${W - P.r - 6}" y="${bt + 13}" text-anchor="end">target range</text>`; }
  const paths = o.series.map((s, si) => {
    const pts = [...s.pts].filter(p => isFinite(p.v)).sort((a, b) => a.d.localeCompare(b.d));
    if (!pts.length) return "";
    const dpath = pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    const last = pts[pts.length - 1];
    const area = o.series.length === 1 ? `<path class="ar" d="${dpath}L${x(last.d).toFixed(1)},${y(lo)}L${x(pts[0].d).toFixed(1)},${y(lo)}Z" fill="url(#g${id})"/>` : "";
    return `${area}<path class="ln" pathLength="1" d="${dpath}" stroke="${s.color}" style="animation-delay:${si * 120}ms"/><circle cx="${x(last.d)}" cy="${y(last.v)}" r="4" fill="${s.color}" stroke="var(--abyss)" stroke-width="2"/>`;
  }).join("");
  const grad = `<defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${o.series[0].color}" stop-opacity=".28"/><stop offset="1" stop-color="${o.series[0].color}" stop-opacity="0"/></linearGradient></defs>`;
  const legend = o.series.length > 1 ? `<div class="legend">${o.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart ${ANIM ? "anim" : ""}" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Trend chart")}">${grad}${band}${g}${paths}<line class="guide" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}"/><rect class="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>${legend}`;
}
function barChart(o) {
  const N = innerWidth < 720, W = N ? 380 : 640, H = o.h || (N ? 220 : 200), P = { l: N ? 34 : 44, r: 10, t: 12, b: 28 };
  const n = o.labels.length; if (!n || !o.values.some(v => v > 0)) return `<div class="empty" style="padding:28px">${ic("chart")}<p>No data in this period.</p></div>`;
  const tk = niceTicks(0, Math.max(...o.values), 4), hi = tk[tk.length - 1];
  const bw = (W - P.l - P.r) / n, y = v => P.t + (1 - v / hi) * (H - P.t - P.b);
  const id = "c" + uid(); CH[id] = { bar: true, o, P, W, H, bw };
  let g = `<g class="ax">${tk.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l - 8}" y="${y(v) + 3.5}" text-anchor="end">${compactAx(v)}</text>`).join("")}`;
  const every = Math.ceil(n / (N ? 4 : 6));
  o.labels.forEach((d, i) => { if (i % every === 0) g += `<text x="${P.l + bw * i + bw / 2}" y="${H - 8}" text-anchor="middle">${fdate(d).replace(/ \d{4}$/, "")}</text>`; });
  g += "</g>";
  const bars = o.values.map((v, i) => v > 0 ? `<rect class="bar" x="${(P.l + bw * i + bw * .18).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${(y(0) - y(v)).toFixed(1)}" rx="${Math.min(4, bw * .2).toFixed(1)}" fill="${o.color}" style="animation-delay:${i * 14}ms"/>` : "").join("");
  return `<div class="chart ${ANIM ? "anim" : ""}" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Bar chart")}">${g}${bars}<rect class="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
}
function compactAx(v) { if (v >= 1e5) return nfx(v / 1e5, 1) + "L"; if (v >= 1000) return nfx(v / 1000, 1) + "k"; return nfx(v, 1); }
function hbars(rows, fmt) {
  const max = Math.max(...rows.map(r => r.v), 0) || 1;
  return `<div class="hbars ${ANIM ? "anim" : ""}">${rows.map((r, i) => `<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.label}</span><div class="t"><i style="width:${Math.max(0, r.v / max * 100)}%;background:${r.color || "var(--accent)"};animation-delay:${i * 80}ms"></i></div><span class="n">${fmt(r.v, r)}</span></div>`).join("")}</div>`;
}
function onChartMove(e) {
  const wrap = e.target.closest(".chart"); if (!wrap) return;
  const c = CH[wrap.dataset.chart]; if (!c) return;
  const svg = wrap.querySelector("svg"), rect = svg.getBoundingClientRect(), sx = (e.clientX - rect.left) / rect.width * c.W;
  const tip = wrap.querySelector(".tip");
  if (c.bar) {
    const i = Math.floor((sx - c.P.l) / c.bw); if (i < 0 || i >= c.o.labels.length) return;
    tip.innerHTML = `<b>${fdate(c.o.labels[i], 1)}</b><div><span>${esc(c.o.name || "Total")}</span><span>${nfx(c.o.values[i], 1)} ${esc(c.o.unit || "")}</span></div>`;
    tip.style.left = ((c.P.l + c.bw * i + c.bw / 2) / c.W * 100) + "%"; tip.style.top = "8px"; tip.classList.add("on"); return;
  }
  const day = Math.round(c.t0 + (sx - c.P.l) / (c.W - c.P.l - c.P.r) * (c.t1 - c.t0)), d = dstr(Math.max(c.t0, Math.min(c.t1, day)));
  const rows = c.o.series.map(s => { const p = s.pts.find(p => p.d === d); return p ? `<div><span style="color:${s.color}">${esc(s.name)}</span><span>${nfx(p.v, 2)} ${esc(c.o.unit || "")}</span></div>` : ""; }).join("");
  const gl = wrap.querySelector(".guide");
  if (!rows) { tip.classList.remove("on"); if (gl) gl.classList.remove("on"); return; }
  tip.innerHTML = `<b>${fdate(d, 1)}</b>${rows}`;
  const px = c.x(d); tip.style.left = Math.max(12, Math.min(88, px / c.W * 100)) + "%"; tip.style.top = "8px"; tip.classList.add("on");
  if (gl) { gl.setAttribute("x1", px); gl.setAttribute("x2", px); gl.classList.add("on"); }
}
document.addEventListener("pointermove", e => { if (e.target.classList && e.target.classList.contains("hit")) onChartMove(e); });
document.addEventListener("pointerout", e => { if (e.target.classList && e.target.classList.contains("hit")) { const w = e.target.closest(".chart"); if (w) { w.querySelector(".tip").classList.remove("on"); const g = w.querySelector(".guide"); if (g) g.classList.remove("on"); } } });

/* daily series helpers */
function daysBetween(from, to) { const a = dnum(from), b = dnum(to), out = []; for (let i = a; i <= b; i++) out.push(dstr(i)); return out; }
function dailySeries(rows, k, agg = "avg") {
  const m = {};
  rows.forEach(r => { const v = Number(r[k]); if (r[k] === "" || r[k] == null || !isFinite(v)) return; (m[r.date] = m[r.date] || []).push(v); });
  return Object.entries(m).map(([d, a]) => ({ d, v: agg === "sum" ? a.reduce((x, y) => x + y, 0) : a.reduce((x, y) => x + y, 0) / a.length }));
}

function profitRows(from, to) {
  const inR = r => r.date >= from && r.date <= to;
  const rows = tanksSorted().map(t => {
    const own = r => r.tankId === t.id && inR(r);
    const hv = S.harvest.filter(own);
    const revenue = sum(hv, h => (h.qty || 0) * (h.price || 0)), kg = sum(hv, "qty");
    const seed = sum(S.stocking.filter(own), "cost"), feed = sum(S.feed.filter(own), feedCost), med = sum(S.medication.filter(own), medCost), other = sum(S.expenses.filter(own), "amount");
    const cost = seed + feed + med + other;
    return { t, revenue, kg, seed, feed, med, other, cost, profit: revenue - cost };
  }).filter(r => r.revenue || r.cost);
  const overhead = sum(S.expenses.filter(e => !e.tankId && inR(e)), "amount");
  const total = { revenue: sum(rows, "revenue"), kg: sum(rows, "kg"), cost: sum(rows, "cost") + overhead };
  total.profit = total.revenue - total.cost;
  return { rows, overhead, total };
}

    ${pl.overhead ? `<tr>${td("Tank", `<span class="sub">Farm overhead</span>`, "wide")}${td("Revenue", "—")}${td("Seed", "—")}${td("Feed", "—")}${td("Medication", "—")}${td("Other", `<span class="mono">${money(pl.overhead)}</span>`)}${td("Profit", `<span class="mono v-crit">${money(-pl.overhead)}</span>`)}</tr>` : ""}

      else if (x < 0) errs[f.k] = "Can't be negative.";
      else if (f.int && !Number.isInteger(x)) errs[f.k] = "Whole number only.";
      else if (f.k === "ph" && (x < 0 || x > 14)) errs[f.k] = "pH runs from 0 to 14.";
      else if (f.k === "avgWeight" && x === 0) errs[f.k] = "Must be above zero.";
    } else if (f.req && !x) errs[f.k] = f.t === "tank" ? "Choose a tank." : "Required.";
    out[f.k] = x;

  if (mod === "items" && out.name) { const dup = S.items.find(t => norm(t.name) === norm(out.name) && t.id !== (S.drawer && S.drawer.id)); if (dup) errs.name = "This item already exists."; }

function browserDownload(filename, data) {

    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000); toast("Downloaded " + filename);
  } catch (e) { toast("Couldn't download the file.", true); }
}
async function save(filename, data) {
  if (!S.downloads && !window.claude) return browserDownload(filename, data);

    if (typeof data === "string") { try { await navigator.clipboard.writeText(data); toast("Downloads aren't available here, so the data was copied instead."); } catch (e) { toast("Downloads aren't available in this view.", true); } }
    else toast("Downloads aren't available in this view. Open the published page.", true);
    return;
  }
  try { await S.downloads.save({ filename, data }); toast("Saved " + filename); }
  catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") toast("A save is already waiting for your answer.", true); else toast("Couldn't save the file here.", true); }
}

async function loadSample() {
  const sd = sampleData();
  const ORDER = ["tanks", "items", "stocking", "feed", "water", "mortality", "medication", "purchases", "expenses", "harvest"];
  const total = ORDER.reduce((a, c) => a + sd[c].length, 0);
  const tankIds = {}, itemIds = {};
  if (!S.db) {
    ORDER.forEach(col => sd[col].forEach(r => {
      const id = uid(); if (col === "tanks") tankIds[r._k] = id; if (col === "items") itemIds[r._k] = id;
      const o = { ...r, sample: true, at: new Date().toISOString() };
      if ("_tank" in o) o.tankId = o._tank ? tankIds[o._tank] : ""; if ("_item" in o) o.itemId = itemIds[o._item];
      delete o._k; delete o._tank; delete o._item; S[col].push({ id, ...o });
    }));
    S.settings = { ...S.settings, farmName: S.settings.farmName || "Sri Lakshmi Aqua Farms", staff: ["Ramesh", "Suresh", "Lakshmi"] };
    render(); return;
  }
  if (S.fb) return loadSampleFb(sd, ORDER, total);
  S.seeding = { label: "Loading sample farm", done: 0, total }; render();
  try {
    for (const col of ORDER) {
      const rows = sd[col];
      for (let i = 0; i < rows.length; i += 8) {
        await Promise.all(rows.slice(i, i + 8).map(async r => {
          const ref = S.db.collection(col).doc();
          if (col === "tanks") tankIds[r._k] = ref.id; if (col === "items") itemIds[r._k] = ref.id;
          const o = { ...r, sample: true, at: new Date().toISOString(), by: S.uid || null };
          if ("_tank" in o) o.tankId = o._tank ? tankIds[o._tank] : ""; if ("_item" in o) o.itemId = itemIds[o._item];
          delete o._k; delete o._tank; delete o._item;
          await withRetry(() => ref.set(o));
        }));
        S.seeding.done = Math.min(total, S.seeding.done + Math.min(8, rows.length - i)); render();
      }
    }
    if (!S.settings.farmName) await store.settings({ farmName: "Sri Lakshmi Aqua Farms", staff: ["Ramesh", "Suresh", "Lakshmi"] });
    toast("Sample farm loaded");
  } catch (e) { toast(dbErr(e), true); }
  S.seeding = null; render();
}
async function withRetry(fn) { for (let a = 0; ; a++) { try { return await fn(); } catch (e) { if (a < 4 && e && (e.code === "resource_exhausted" || e.code === "unavailable")) { await new Promise(r => setTimeout(r, 900 * (a + 1) + Math.random() * 400)); continue; } throw e; } } }
async function clearSample() {
  if (!S.db) { COLS.forEach(c => S[c] = S[c].filter(r => !r.sample)); render(); toast("Sample data removed"); return; }
  const docs = []; COLS.forEach(c => S[c].filter(r => r.sample).forEach(r => docs.push([c, r.id])));
  if (S.fb) return clearSampleFb(docs);
  S.seeding = { label: "Removing sample data", done: 0, total: docs.length }; render();
  try {
    for (let i = 0; i < docs.length; i += 8) { await Promise.all(docs.slice(i, i + 8).map(([c, id]) => withRetry(() => S.db.doc(c + "/" + id).delete()))); S.seeding.done = Math.min(docs.length, i + 8); render(); }
    toast("Sample data removed");
  } catch (e) { toast(dbErr(e), true); }
  S.seeding = null; render();
}

(function ocean() {
  const c = $("#ocean"), x = c.getContext("2d"); if (!x) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = matchMedia("(max-width: 720px)").matches;
  let w, h; const SCALE = .5;
  const blobs = Array.from({ length: small ? 4 : 6 }, (_, i) => ({ x: Math.random(), y: Math.random() * .8, r: .25 + Math.random() * .3, sx: (Math.random() - .5) * .00004, sy: (Math.random() - .5) * .00003, hue: i % 2 ? "92,225,214" : "60,140,220", a: .05 + Math.random() * .05 }));
  const bubbles = Array.from({ length: small ? 14 : 26 }, () => ({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 2.2, s: .00004 + Math.random() * .00008, ph: Math.random() * 6 }));
  function size() { w = innerWidth; h = innerHeight; c.width = Math.ceil(w * SCALE); c.height = Math.ceil(h * SCALE); x.setTransform(SCALE, 0, 0, SCALE, 0, 0); }
  let last = 0;
  function frame(t) {
    if (!reduce) requestAnimationFrame(frame);
    if (document.hidden || (t - last < 40 && last)) return;
    const dt = last ? Math.min(80, t - last) : 16; last = t;
    x.clearRect(0, 0, w, h);
    x.globalCompositeOperation = "lighter";
    blobs.forEach(b => {
      b.x += b.sx * dt; b.y += b.sy * dt; if (b.x < -.2 || b.x > 1.2) b.sx *= -1; if (b.y < -.2 || b.y > 1) b.sy *= -1;
      const R = b.r * Math.max(w, h), g = x.createRadialGradient(b.x * w, b.y * h, 0, b.x * w, b.y * h, R);
      g.addColorStop(0, `rgba(${b.hue},${b.a})`); g.addColorStop(1, `rgba(${b.hue},0)`); x.fillStyle = g; x.fillRect(0, 0, w, h);
    });
    x.globalCompositeOperation = "source-over";
    bubbles.forEach(b => {
      b.y -= b.s * dt; b.ph += .002 * dt; if (b.y < -.02) { b.y = 1.02; b.x = Math.random(); }
      const bx = b.x * w + Math.sin(b.ph) * 8, by = b.y * h;
      x.beginPath(); x.arc(bx, by, b.r * 2, 0, Math.PI * 2); x.strokeStyle = `rgba(160,240,235,${.08 + b.r * .03})`; x.lineWidth = 1.4; x.stroke();
    });
  }
  size(); addEventListener("resize", size, { passive: true });
  requestAnimationFrame(frame);
})();

  if (!S.fb || !S.farmId || !S.canWrite) return;
  const d = today();
  FDB.doc(`farms/${S.farmId}/stats/activity`).set({ days: { [d]: firebase.firestore.FieldValue.increment(1) }, lastEntry: d, at: new Date().toISOString() }, { merge: true }).catch(() => {});
}
let sumTimer = null, lastSum = "";
function syncSummary() {
  if (!S.fb || !S.farmId || S.mode !== "db" || !S.canWrite) return;
  clearTimeout(sumTimer); sumTimer = setTimeout(() => {
    if (!S.farmId || S.mode !== "db") return;
    const act = S.tanks.filter(t => t.status !== "Inactive"), live = Math.round(sum(act, t => curCycle(t.id).current));
    const o = { ponds: act.length, live }; if (S.isAdmin && S.access.length) o.team = S.access.length;
    const key = S.farmId + JSON.stringify(o); if (key === lastSum) return; lastSum = key;
    FDB.doc(`farms/${S.farmId}/stats/activity`).set({ ...o, at: new Date().toISOString() }, { merge: true }).catch(() => {});
  }, 4000);
}
function lastSeen(d) {
  if (!d) return { t: "No entries yet", c: "warn" };
  const n = dnum(today()) - dnum(d);
  return n <= 0 ? { t: "Today", c: "ok" } : n === 1 ? { t: "Yesterday", c: "ok" } : { t: `${n} days ago`, c: n >= 5 ? "warn" : "" };
}
const monthlyValue = f => { const i = PLAN_INFO[f.plan]; if (!i || !i.months || f.status === "paused") return 0; return (f.price ?? i.price) / i.months; };
function farmPayments() { const out = []; S.allFarms.forEach(f => (f.payments || []).forEach(p => out.push({ ...p, farm: f.name, fid: f.id }))); return out.sort((a, b) => b.date.localeCompare(a.date)); }

function followUps(farms) {
  const out = [];
  farms.forEach(f => {
    const b = billing(f), u = farmUse(f), ls = lastSeen(u.lastEntry);
    if (b.k === "overdue") out.push({ sev: "crit", f, title: `${f.name}: ${b.label.toLowerCase()}`, detail: b.price ? `${money(b.price)} ${f.plan.toLowerCase()} plan · pause if unpaid` : "Convert to a paid plan or pause", act: "pay" });
    else if (b.k === "due") out.push({ sev: "warn", f, title: `${f.name}: renewal ${b.label.toLowerCase()}`, detail: `${money(b.price)} on ${fdate(f.paidUntil)} · send a reminder`, act: "remind" });
    else if (b.k === "trial" && b.days <= 3) out.push({ sev: "warn", f, title: `${f.name}: trial ends in ${b.days} day${b.days === 1 ? "" : "s"}`, detail: "Call the owner and offer a plan", act: "call" });
    if (f.status !== "paused" && ls.c === "warn") out.push({ sev: "info", f, title: `${f.name}: quiet for ${u.lastEntry ? ls.t : "a while"}`, detail: "No records logged. Check if staff need help", act: "call" });
  });
  return out.sort((a, b) => ({ crit: 0, warn: 1, info: 2 })[a.sev] - ({ crit: 0, warn: 1, info: 2 })[b.sev]);
}
function incomeChart() {
  const t = today(), months = []; for (let i = 5; i >= 0; i--) { const d = new Date(+t.slice(0, 4), +t.slice(5, 7) - 1 - i, 1); months.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }
  const pays = farmPayments(), vals = months.map(m => sum(pays.filter(p => p.date.startsWith(m)), "amount"));
  const W = 520, H = 190, L = 44, R = 8, T = 12, B = 26, mx = Math.max(10000, ...vals), step = mx > 40000 ? 20000 : 10000, top = Math.ceil(mx / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top), cw = (W - L - R) / months.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="inc" role="img" aria-label="Payments collected per month">`;
  for (let v = 0; v <= top; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v ? "₹" + v / 1000 + "k" : "0"}</text>`;
  vals.forEach((v, i) => { const x = L + i * cw + cw * .22, w = cw * .56; s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, y(0) - y(v))}" rx="5" class="b${i === 5 ? " now" : ""}"><title>${MON[+months[i].slice(5) - 1]}: ${money(v)}</title></rect>${v ? `<text x="${x + w / 2}" y="${y(v) - 6}" text-anchor="middle" class="vl">${v >= 1000 ? "₹" + nfx(v / 1000, 1) + "k" : money(v)}</text>` : ""}<text x="${x + w / 2}" y="${H - 7}" text-anchor="middle">${MON[+months[i].slice(5) - 1]}</text>`; });
  return s + `</svg>`;
}

async function savePayment(form) {
  const f = farmById(form.dataset.id); if (!f) return;
  const amt = Number(String($("#pf_amt").value).replace(/[^\d.]/g, "")), plan = $("#pf_plan").value, pi = PLAN_INFO[plan];
  if (!(amt > 0)) { toast("Enter the amount received.", true); $("#pf_amt").focus(); return; }
  const from = f.paidUntil && f.paidUntil >= today() ? f.paidUntil : today(), until = addDays(from, pi.months * 30);
  const payments = (f.payments || []).concat([{ date: $("#pf_date").value || today(), amount: amt, method: $("#pf_method").value, ref: $("#pf_ref").value.trim(), months: pi.months, by: S.uid }]);
  try { await FDB.doc("farms/" + f.id).set({ plan, paidUntil: until, payments, status: "active" }, { merge: true }); closeSheet(); toast(`${money(amt)} recorded. ${f.name} paid till ${fdate(until, 1)}.`); }
  catch (e) { toast(dbErr(e), true); }
}

  const f = a.dataset.id && farmById(a.dataset.id);
  switch (a.dataset.act) {
    case "farm-new": newFarmSheet(); break;
    case "prov-set": provSheet(); break;
    case "sample-farms": sampleSheet(); break;
    case "sample-one": if (f) sampleSheet(f.id); break;
    case "sm-all": { const bx = $$(".sm_f"), on = bx.some(x => !x.checked); bx.forEach(x => x.checked = on); a.textContent = on ? "Clear all" : "Select all"; break; }
    case "sample-load": loadSampleFarms(); break;
    case "sample-clear": clearSampleFarms(); break;
    case "farm-edit": if (f) editSheet(f); break;
    case "farm-tab": S.farmTab = a.dataset.f; render(); break;
    case "farm-pay": if (f) paySheet(f); break;

}, true);

async function createFarm() {
  const name = $("#nf_name").value.trim(), loc = $("#nf_loc").value.trim(), owner = $("#nf_owner").value.trim().toLowerCase(), plan = $("#nf_plan").value, phone = $("#nf_phone").value.trim();
  if (!name) { toast("Enter the farm name.", true); $("#nf_name").focus(); return; }
  if (!/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(owner)) { toast("Enter the owner's full Google email.", true); $("#nf_owner").focus(); return; }
  const ref = FDB.collection("farms").doc(), fid = ref.id, b = FDB.batch(), now = new Date().toISOString(), price = Number($("#nf_price").value) || null;
  const doc = { name, location: loc, owner, phone, plan, status: "active", createdAt: now, createdBy: S.uid, payments: [] };
  if (plan === "Trial") doc.trialEnds = addDays(today(), 14); else if (price) doc.price = price;
  b.set(ref, doc);
  b.set(FDB.doc(`farms/${fid}/members/${owner}`), { role: "owner", addedBy: S.uid, at: now });
  b.set(FDB.doc(`memberships/${owner}/farms/${fid}`), { role: "owner", farmName: name });
  b.set(FDB.doc(`farms/${fid}/config/settings`), { farmName: name, currency: "₹" });
  try { await b.commit(); closeSheet(); S.setDirty = false; toast(`${name} created. ${owner} can sign in now.`); }
  catch (e) { toast(dbErr(e), true); }
}

async function seedRecords(fid, opt = {}) {
  const sd = sampleData(), ORDER = ["tanks", "items", "stocking", "feed", "water", "mortality", "medication", "purchases", "expenses", "harvest"];
  const tankIds = {}, itemIds = {}, ops = [], now = new Date().toISOString();
  ORDER.forEach(col => sd[col].forEach((r, k) => {
    const ref = FDB.collection(`farms/${fid}/${col}`).doc();
    if (col === "tanks") { tankIds[r._k] = ref.id; if (opt.prefix) { r.code = opt.prefix + "-" + String(k + 1).padStart(2, "0"); if (opt.ponds && opt.ponds[k]) r.name = opt.ponds[k]; } if (opt.fish) r.species = "Fish"; }
    if (col === "items") itemIds[r._k] = ref.id;
    ops.push([ref, r]);
  }));
  for (let i = 0; i < ops.length; i += 400) {
    const b = FDB.batch();
    ops.slice(i, i + 400).forEach(([ref, r]) => {
      const o = { ...r, sample: true, at: now, by: S.uid || null };
      if ("_tank" in o) o.tankId = o._tank ? tankIds[o._tank] : ""; if ("_item" in o) o.itemId = itemIds[o._item];
      delete o._k; delete o._tank; delete o._item; b.set(ref, o);
    });
    await withRetry(() => b.commit());
  }
  return ops.length;
}
function sampleSheet(sel = "all") {

    <label class="chk"><input type="checkbox" id="sm_farms" ${nSample ? "disabled" : "checked"}> <span><b>Add 5 sample client farms</b><span class="sub">With ponds, feed, water, harvest, payments and activity. Shows paid, due, overdue, trial and paused farms.${nSample ? " Already added." : ""}</span></span></label>
    ${real.length ? `<div class="smlist"><div class="smhd"><b>Add sample records to these farms</b><button type="button" class="btn ghost sm" data-act="sm-all">${sel === "all" ? "Clear all" : "Select all"}</button></div>

    <div class="preview" id="sm_prog" hidden></div>
